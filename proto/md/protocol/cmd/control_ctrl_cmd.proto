syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message ControlCtrlCmdData {
  uint32 horizontal_mode = 1;
  uint32 horizontal_frame = 2;
  float velocity_x = 3;
  float velocity_y = 4;
  float position_x = 5;
  float position_y = 6;
  uint32 yaw_mode = 7;
  float yaw_rate = 8;
  float yaw_target = 9;
  uint32 gimbal_yaw_mode = 10;
  uint32 gimbal_pitch_mode = 11;
  float gimbal_yaw = 12;
  float gimbal_yaw_rate = 13;
  float gimbal_pitch = 14;
  float height = 15;
  float pitch_angle = 16;
  float roll_angle = 17;
  uint32 loco_profile = 18;
  uint32 action_trigger = 19;
  uint32 target_state = 20;
  float jump_height = 21;
  float jump_distance = 22;
  uint64 timestamp_ns = 23;
  uint32 loco_yaw_control_mode = 24;
  uint32 jump_source = 25;
  uint32 enable_vel_x_integrator = 26;
  uint32 fpv_skill_router_mode = 27;
  uint64 wheel_command_calibration = 28;
}
