syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CameraRecordCommitReqData {
  uint32 protocol_version = 1;
  uint32 action = 2;
  uint32 target_owner = 3;
  uint32 cue_result = 4;
  uint32 coordinator_epoch = 5;
  uint32 origin_source_id = 6;
  uint32 origin_seq_num = 7;
  uint64 transaction_id = 8;
  uint64 issued_at_wall_us = 9;
  uint32 max_age_ms = 10;
  uint32 deferred_flags = 11;
}
