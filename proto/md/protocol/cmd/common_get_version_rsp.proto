syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CommonGetVersionRspData {
  uint32 ret_code = 1;
  uint32 major_version = 2;
  uint32 minor_version = 3;
  bytes hardware_version = 4;
  bytes loader_version = 5;
  bytes firmware_version = 6;
  uint32 is_mass_product = 7;
}
