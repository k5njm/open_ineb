syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message PlannerIntentData {
  uint32 schema_version = 1;
  uint32 source = 2;
  uint32 kind = 3;
  uint32 source_clock_domain = 4;
  uint32 valid_fields = 5;
  uint64 source_instance_id = 6;
  uint64 sequence = 7;
  uint64 source_timestamp_ns = 8;
  uint64 receive_mono_ns = 9;
  uint32 lease_duration_us = 10;
  uint32 linear_frame = 11;
  uint32 yaw_mode = 12;
  uint32 action_id = 13;
  repeated float linear_velocity_mps = 14;
  float yaw_rate_rad_s = 15;
  float yaw_target_rad = 16;
  float body_height_m = 17;
  float body_pitch_rad = 18;
  float body_roll_rad = 19;
  repeated float action_params = 20;
}
