syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message AuxAuthorityRequestData {
  uint32 schema_version = 1;
  uint32 operation = 2;
  uint32 source = 3;
  uint64 request_id = 4;
  uint64 expected_engagement_id = 5;
  uint64 requested_owner_instance_id = 6;
  uint64 request_mono_ns = 7;
  uint64 deadline_mono_ns = 8;
}
