syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message PlannerTextInstructionData {
  uint32 schema_version = 1;
  uint32 source = 2;
  uint32 flags = 3;
  uint32 source_clock_domain = 4;
  uint64 source_instance_id = 5;
  uint64 utterance_id = 6;
  uint64 sequence = 7;
  uint64 source_timestamp_ns = 8;
  uint64 receive_mono_ns = 9;
  float confidence = 10;
  uint32 language_code = 11;
  uint32 text_length = 12;
  bytes utf8_text = 13;
}
