syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message RealRlControlRequestData {
  uint32 version = 1;
  uint32 inference_mode = 2;
  uint32 rollout_recording_requested = 3;
  uint32 recording_duration_ms = 4;
  uint64 client_session_id = 5;
  float exploration_scale = 6;
}
