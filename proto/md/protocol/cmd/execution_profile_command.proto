syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message ExecutionProfileCommandData {
  uint32 schema_version = 1;
  uint32 operation = 2;
  uint32 flags = 3;
  uint64 request_id = 4;
  uint64 expected_authority_generation = 5;
  uint64 expected_manifest_generation = 6;
  uint64 request_mono_ns = 7;
  uint64 deadline_mono_ns = 8;
  uint32 expected_active_profile_name_length = 9;
  bytes expected_active_profile_name = 10;
  uint32 target_profile_name_length = 11;
  bytes target_profile_name = 12;
  bytes deployment_manifest_hash = 13;
  uint32 reason_code = 14;
}
