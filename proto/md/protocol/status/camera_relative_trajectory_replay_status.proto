syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message CameraRelativeTrajectoryReplayStatusData {
  uint32 phase = 1;
  uint32 accepted_client_request_id = 2;
  uint32 replay_session_id = 3;
  uint32 trajectory_id_len = 4;
  bytes trajectory_id = 5;
  uint32 sample_index = 6;
  uint32 terminal_reason = 7;
  uint32 restored_sub_mode = 8;
  uint32 oa_flags = 9;
  uint32 elapsed_ms = 10;
  uint32 duration_ms = 11;
  uint32 preparation_state = 12;
  uint32 preparation_elapsed_ms = 13;
  uint32 preparation_duration_ms = 14;
  uint32 robot_position_valid = 15;
  float robot_relative_x_m = 16;
  float robot_relative_y_m = 17;
}
