syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message GatewayAnalyticsEventTransferData {
  bytes delivery_id = 1;
  uint64 occurred_at_ms = 2;
  bytes event_id = 3;
  bytes producer = 4;
  uint64 count = 5;
  uint32 attributes_json_len = 6;
  bytes attributes_json = 7;
}
