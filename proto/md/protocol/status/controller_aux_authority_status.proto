syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message ControllerAuxAuthorityStatusData {
  uint32 schema_version = 1;
  uint32 state = 2;
  uint32 source = 3;
  uint64 controller_instance_id = 4;
  uint64 request_id = 5;
  uint64 engagement_id = 6;
  uint64 owner_instance_id = 7;
  uint64 aux_authority_id = 8;
  uint64 status_sequence = 9;
  uint64 status_mono_ns = 10;
  uint32 reason = 11;
}
