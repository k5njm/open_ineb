syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message AudioVoiceEventData {
  uint64 timestamp_ms = 1;
  float score = 2;
  uint32 keyword_id = 3;
  float doa_angle_deg = 4;
  float doa_confidence = 5;
  uint64 session_id = 6;
  uint64 confirmed_timestamp_ns = 7;
  uint64 command_end_timestamp_ns = 8;
}
