syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message GameStatusData {
  uint64 timestamp_ns = 1;
  uint32 game_type = 2;
  uint32 state = 3;
  uint32 sub_state = 4;
  uint32 player_count = 5;
  uint32 session_id = 6;
  uint32 elapsed_ms = 7;
  uint32 remaining_ms = 8;
  float progress = 9;
  uint32 winner = 10;
  uint32 pause_reason = 11;
  uint32 record_hint = 12;
  uint32 error_code = 13;
  bytes player_state = 14;
  repeated float score = 15;
  uint32 flags = 16;
}
