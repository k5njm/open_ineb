syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message HmsEventBroadcastData {
  uint64 offset = 1;
  uint32 module_id = 2;
  uint32 fault_code = 3;
  uint32 instance_id = 4;
  uint32 kind = 5;
  uint32 severity = 6;
  uint64 timestamp_ms = 7;
  uint64 daemon_instance_id = 8;
  uint64 state_revision = 9;
  uint32 origin = 10;
  uint32 recovery_state = 11;
}
