syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";
import "md/protocol/common/imu_observation.proto";
import "md/protocol/common/joint_observation.proto";

message ControlStatusData {
  uint64 timestamp_ns = 1;
  uint32 actual_state = 2;
  uint32 fault_code = 3;
  uint32 active_profile = 4;
  uint32 active_model_id = 5;
  uint32 jump_flag = 6;
  uint32 active_policy = 7;
  float velocity_x = 8;
  float velocity_y = 9;
  float yaw_rate = 10;
  float pitch = 11;
  float roll = 12;
  float yaw = 13;
  float height = 14;
  float odometry_m = 15;
  float session_odom_dis = 16;
  md.protocol.common.ImuObservation body_imu = 17;
  md.protocol.common.ImuObservation gimbal_imu = 18;
  md.protocol.common.JointObservation joints = 19;
  repeated float obs = 20;
  repeated float action = 21;
  uint32 jump_cooldown = 22;
  float jump_phase = 23;
  float inference_us = 24;
  uint32 needs_smooth = 25;
  float gimbal_cmd_yaw = 26;
  float gimbal_cmd_yaw_rate = 27;
  float gimbal_smoothed_target = 28;
  float gimbal_pos_error = 29;
  float gimbal_target_vel = 30;
  float gimbal_feedback_vel = 31;
  float gimbal_accel_cmd = 32;
  float gimbal_torque = 33;
  float gimbal_feedback_pos = 34;
  float gimbal_vel_error = 35;
  float gimbal_vel_integral = 36;
  uint32 gimbal_mode = 37;
  uint32 wheel_assembly_type = 38;
  uint32 off_ground = 39;
  uint32 moe_in_recover = 40;
  uint32 moe_switch_event = 41;
  uint32 moe_gate_masked = 42;
  uint32 moe_switch_seq = 43;
  float moe_w_recover_raw = 44;
  float moe_w_recover_ema = 45;
  float wheel_command_scale = 46;
  uint32 wheel_command_scale_reason = 47;
}
