syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PlannerInferenceTraceData {
  uint32 schema_version = 1;
  uint32 flags = 2;
  uint32 inference_backend = 3;
  uint32 execution_provider = 4;
  uint32 scheduling_priority = 5;
  uint32 result_code = 6;
  uint64 producer_instance_id = 7;
  uint64 engagement_id = 8;
  uint64 planner_epoch_id = 9;
  uint64 handover_id = 10;
  uint64 session_id = 11;
  uint64 cycle_sequence = 12;
  uint64 request_id = 13;
  uint64 submit_mono_ns = 14;
  uint64 execute_start_mono_ns = 15;
  uint64 complete_mono_ns = 16;
  bytes model_artifact_id = 17;
  uint32 input_tensor_count = 18;
  uint32 output_tensor_count = 19;
  uint64 input_bytes = 20;
  uint64 output_bytes = 21;
  uint32 queue_wait_us = 22;
  uint32 host_to_device_us = 23;
  uint32 inference_us = 24;
  uint32 device_to_host_us = 25;
}
