syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";
import "md/protocol/common/local_mapping_surface_segment.proto";

message LocalMappingForwardSurfaceData {
  uint32 storage_version = 1;
  uint32 flags = 2;
  uint32 segment_count = 3;
  uint64 map_generation = 4;
  uint64 window_revision = 5;
  uint64 source_task_seq = 6;
  uint64 source_timestamp_ns = 7;
  uint64 source_received_ts_ns = 8;
  repeated double reference_robot_world_xy = 9;
  double reference_robot_world_z_m = 10;
  double reference_yaw_world_rad = 11;
  uint64 active_block_mask = 12;
  uint64 selected_block_mask = 13;
  double cell_resolution_m = 14;
  repeated md.protocol.common.LocalMappingSurfaceSegment segments = 15;
}
