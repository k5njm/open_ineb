syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message LogJumpAutoDataData {
  uint64 timestamp_ns = 1;
  uint64 jump_auto_infer_done_ts = 2;
  uint64 process_done_ns = 3;
  uint64 vae_exposure_ts_ns = 4;
  uint64 vae_infer_done_ts = 5;
  uint32 vae_frame_id = 6;
  repeated float obs_gyro = 7;
  repeated float obs_grav = 8;
  float obs_target_vel_x = 9;
  float obs_reserved = 10;
  float obs_yaw_cmd_input = 11;
  repeated float obs_joint_pos = 12;
  repeated float obs_joint_vel = 13;
  repeated float obs_prev_action = 14;
  repeated float obs_base_pose = 15;
  repeated float obs_gimbal_yaw_cmd = 16;
  repeated float obs_gimbal_gyro = 17;
  repeated float obs_vae_latent = 18;
  repeated float raw_action = 19;
  float jump_flag = 20;
  float jump_phase = 21;
  float jump_height = 22;
  float jump_stand_dis = 23;
  float hl_vel_x = 24;
  float hl_omega_z = 25;
  float hl_roll = 26;
  float hl_pitch = 27;
  float hl_height = 28;
  float policy_ms = 29;
  float vae_age_ms = 30;
  uint32 jump_count = 31;
  uint32 nav_level = 32;
  uint32 use_mnn = 33;
  uint32 policy_active = 34;
  uint32 jump_active = 35;
  uint64 wheel_pose_timestamp_ns = 36;
  uint64 surface_seq = 38;
  uint64 surface_timestamp_ns = 39;
  repeated float wheel_vel_xyz = 46;
  float forward_distance_m = 47;
  uint32 wheel_pose_invalid = 52;
  uint32 query_status = 53;
  uint32 process_status = 54;
  float wheel_vel_norm = 55;
  float frame_reuse_count = 56;
  float obs_frame_age = 57;
  float vae_source_age_ms = 58;
}
