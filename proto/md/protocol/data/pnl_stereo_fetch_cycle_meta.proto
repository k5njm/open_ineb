syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PnlStereoFetchCycleMetaData {
  uint32 frame_seq = 1;
  uint64 cycle_start_ns = 2;
  uint64 pop_done_ns = 3;
  uint64 fetch_done_ns = 4;
  uint64 match_done_ns = 5;
  uint64 dispatch_done_ns = 6;
  uint64 left_data_ts_ns = 7;
  uint64 right_data_ts_ns = 8;
  uint64 callback_enter_ns = 9;
  uint32 src_frame_seq = 10;
  uint32 image_width = 11;
  uint32 image_height = 12;
  uint32 match_result = 13;
  uint32 pop_timeout = 14;
  uint32 image_valid = 15;
  uint32 camera_id = 16;
  uint32 trimmed = 17;
  uint32 purged = 18;
  uint32 discarded = 19;
  uint32 left_qlen = 20;
  uint32 right_qlen = 21;
  sint32 pnl_dropped = 22;
  uint32 vio_dropped = 23;
  uint64 matched_left_ts_ns = 24;
  uint32 meta_queue_drop_total = 25;
  uint32 pnl_dispatch_divider = 26;
  uint32 pnl_divider_skipped = 27;
}
