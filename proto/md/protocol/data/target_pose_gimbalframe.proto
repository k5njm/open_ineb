syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message TargetPoseGimbalframeData {
  repeated double pos_xyz = 1;
  repeated float vel_xyz = 2;
  uint32 state = 3;
  float pose_sd = 4;
  float vel_sd = 5;
  uint64 detection_timestamp_ns = 6;
  uint32 target_source = 7;
}
