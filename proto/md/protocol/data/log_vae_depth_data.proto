syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message LogVaeDepthDataData {
  uint32 source_stream_id = 1;
  uint32 encoder_type = 2;
  uint32 process_status = 3;
  uint32 inference_executed = 4;
  uint64 source_seq = 5;
  uint64 timestamp_ns = 6;
  uint64 depth_received_ts = 7;
  uint64 task_seq = 8;
  uint64 process_done_ns = 9;
  uint32 preprocess_profile = 10;
  uint32 depth_encoding = 11;
  float normalization_scale_m = 12;
  uint32 image_width = 13;
  uint32 image_height = 14;
  float camera_fx = 15;
  float camera_fy = 16;
  float camera_cx = 17;
  float camera_cy = 18;
  repeated uint32 depth_data = 19;
}
