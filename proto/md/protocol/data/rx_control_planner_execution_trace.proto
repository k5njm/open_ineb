syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message RxControlPlannerExecutionTraceData {
  uint32 schema_version = 1;
  uint32 representation = 2;
  uint32 body_controller_kind = 3;
  uint32 route = 4;
  uint32 flags = 5;
  uint64 controller_instance_id = 6;
  uint64 producer_instance_id = 7;
  uint64 engagement_id = 8;
  uint64 planner_epoch_id = 9;
  uint64 handover_id = 10;
  uint64 session_id = 11;
  uint64 control_tick_sequence = 12;
  uint64 tick_mono_ns = 13;
  uint64 accepted_packet_sequence = 14;
  sint64 consumed_frame_index = 15;
  uint32 reference_age_us = 16;
  uint32 gmr_us = 17;
  uint32 encoder_us = 18;
  uint32 decoder_us = 19;
  uint32 consumer_state = 20;
  uint32 result_or_reject_code = 21;
}
