syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message LogCollisionDetectionDataData {
  uint64 timestamp_ns = 1;
  uint64 task_seq = 2;
  uint64 task_created_ns = 3;
  uint64 task_started_ns = 4;
  uint64 task_done_ns = 5;
  uint64 wheel_pose_timestamp_ns = 6;
  uint64 wheel_pose_received_ns = 7;
  uint64 control_status_timestamp_ns = 8;
  uint64 control_status_received_ns = 9;
  uint64 surface_seq = 10;
  uint64 surface_timestamp_ns = 11;
  uint64 surface_received_ns = 12;
  uint64 surface_source_task_seq = 13;
  uint64 map_generation = 14;
  uint64 query_source_timestamp_ns = 15;
  uint64 last_distance_proposal_tick = 16;
  uint64 last_acceleration_proposal_tick = 17;
  repeated double wheel_pos_xyz = 18;
  repeated double wheel_q_xyzw = 19;
  repeated double left_ray_collision_body_xy = 20;
  repeated double right_ray_collision_body_xy = 21;
  repeated double collision_body_xy = 22;
  float distance_m = 23;
  float raw_distance_m = 24;
  float left_ray_distance_m = 25;
  float right_ray_distance_m = 26;
  float jump_phase = 27;
  repeated float acceleration_mps2 = 28;
  float acceleration_magnitude_mps2 = 29;
  float trend_start_distance_m = 30;
  float trend_previous_distance_m = 31;
  float trend_minimum_distance_m = 32;
  float trend_total_decrease_m = 33;
  float ended_total_decrease_m = 34;
  float ended_minimum_distance_m = 35;
  uint32 input_health_mask = 36;
  uint32 runtime_gate_reason_mask = 37;
  uint32 fallback_flags = 38;
  uint32 trend_sample_count = 39;
  uint32 action_suppression_remaining_ticks = 40;
  uint32 event_cooldown_remaining_ticks = 41;
  uint32 wheel_pose_state = 42;
  uint32 wheel_pose_source_id = 43;
  uint32 wheel_pose_data_flag = 44;
  uint32 actual_state = 45;
  uint32 active_model_id = 46;
  uint32 active_policy = 47;
  uint32 jump_flag = 48;
  uint32 body_imu_online = 49;
  uint32 query_status = 50;
  uint32 process_status = 51;
  uint32 runtime_eligible = 52;
  uint32 trend_active = 53;
  uint32 trend_end_reason = 54;
  uint32 distance_proposal = 55;
  uint32 acceleration_proposal = 56;
  uint32 collision_proposal = 57;
  uint32 collision_event = 58;
  uint32 hms_active = 59;
  uint64 reserved0 = 64;
  uint32 speed_status = 83;
  uint64 speed_reference_timestamp_ns = 85;
  float speed_reference_mps = 86;
  uint64 reserved1 = 94;
  float speed_threshold_mps = 109;
  uint32 collision_event_raw = 110;
}
