syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message LocalMappingSilGeometryData {
  uint64 map_generation = 1;
  uint64 window_revision = 2;
  uint64 source_task_seq = 3;
  uint64 source_timestamp_ns = 4;
  repeated float robot_world_xy_yaw = 5;
  repeated float scan_origin_world_xy = 6;
  uint64 active_block_mask = 7;
  uint64 selected_block_mask = 8;
  uint32 scan_point_count = 9;
  uint32 surface_segment_count = 10;
  uint32 truncated_segment_count = 11;
  uint32 reserved0 = 12;
  repeated float scan_hit_world_xy = 13;
  repeated float surface_segment_world_xy = 14;
}
