syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message BlackboxTriggerEventData {
  uint32 schema_version = 1;
  uint32 severity = 2;
  uint32 source_kind = 3;
  uint32 reason_code = 4;
  uint32 flags = 5;
  uint64 source_instance_id = 6;
  uint64 sequence = 7;
  uint64 event_mono_ns = 8;
  uint64 engagement_id = 9;
  uint64 planner_epoch_id = 10;
  uint64 handover_id = 11;
  uint64 related_topic_sequence = 12;
}
