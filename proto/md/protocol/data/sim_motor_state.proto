syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message SimMotorStateData {
  repeated float position = 1;
  repeated float velocity = 2;
  repeated float current = 3;
  repeated float torque = 4;
  uint32 online_mask = 5;
  bytes _pad = 6;
  uint64 timestamp_ns = 7;
}
