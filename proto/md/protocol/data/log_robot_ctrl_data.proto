syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message LogRobotCtrlDataData {
  uint64 timestamp_ns = 1;
  uint64 src_header_timestamp_ns = 2;
  uint32 src_seq_num = 3;
  uint32 robot_state = 4;
  uint32 ctrl_mode = 5;
  float velocity_x = 6;
  float velocity_y = 7;
  float roll_angle = 8;
  float pitch_angle = 9;
  float yaw_speed = 10;
  float gimbal_angle = 11;
  float height = 12;
  float jump_dis = 13;
  uint32 jump_flag = 14;
  uint32 flip_flag = 15;
  uint32 nav_flag = 16;
  uint32 switch_net = 17;
}
