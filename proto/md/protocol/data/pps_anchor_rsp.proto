syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PpsAnchorRspData {
  uint32 version = 1;
  uint32 status = 2;
  uint32 client_generation = 3;
  uint32 server_generation = 4;
  uint64 client_boot_id = 5;
  uint64 server_session_id = 6;
  uint64 txn_id = 7;
  uint32 a0_seq = 8;
  uint32 x1_seq = 9;
  uint64 x1_pulse_utc_ns = 10;
  uint32 flags = 11;
  uint32 source_uncertainty_ns = 12;
  uint64 server_response_realtime_ns = 13;
}
