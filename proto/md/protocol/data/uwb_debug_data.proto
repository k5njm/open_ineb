syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message UwbDebugDataData {
  uint32 event = 1;
  uint64 sequence_id = 2;
  uint64 system_timestamp_ns = 3;
  double sensor_timestamp_s = 4;
  float raw_distance = 5;
  float raw_angle = 6;
  float raw_elevation = 7;
  float rssi = 8;
  uint32 quality = 9;
  double receive_delay_ms = 10;
  repeated double ant_iq = 11;
  uint64 process_timestamp_ns = 12;
  uint64 raw_sequence_id = 13;
  uint32 observation_mode = 14;
  uint32 state = 15;
  uint32 process_mode = 16;
  float post_x = 17;
  float post_y = 18;
  float post_vx = 19;
  float post_vy = 20;
  float post_heading = 21;
  float filtered_distance = 22;
  float filtered_angle = 23;
  float filtered_elevation = 24;
  float pose_sd = 25;
  float sigma_x = 26;
  float sigma_y = 27;
  float processing_time_ms = 28;
  uint32 update_count = 29;
  uint32 outlier_count = 30;
  float do_P_px = 31;
  float do_P_py = 32;
  float do_P_vx = 33;
  float do_P_vy = 34;
  float do_P_heading = 35;
  float do_innov_0 = 36;
  float do_innov_1 = 37;
  float do_mahalanobis = 38;
  float jt_P_px = 39;
  float jt_P_py = 40;
  float jt_P_vx = 41;
  float jt_P_vy = 42;
  float jt_innov_x = 43;
  float jt_innov_y = 44;
  float jt_mahalanobis = 45;
  float sp_dist_P_d = 46;
  float sp_dist_P_vd = 47;
  float sp_dist_innov = 48;
  float sp_dist_mahalanobis = 49;
  float sp_angle_P_theta = 50;
  float sp_angle_P_omega = 51;
  float sp_angle_innov = 52;
  float sp_angle_mahalanobis = 53;
  float elev_P_theta = 54;
  float elev_P_omega = 55;
  float elev_innov = 56;
  float elev_mahalanobis = 57;
}
