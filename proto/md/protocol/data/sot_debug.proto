syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message SotDebugData {
  uint32 valid = 1;
  uint32 sot_active = 2;
  uint32 pad0 = 3;
  uint32 pad1 = 4;
  float bbox_x = 5;
  float bbox_y = 6;
  float bbox_w = 7;
  float bbox_h = 8;
  float confidence = 9;
  float iou_vs_deepsort = 10;
  uint32 lost_conf_frames = 11;
  uint32 frames_since_update = 12;
  uint64 frame_timestamp_ns = 13;
}
