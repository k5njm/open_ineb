syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PnlDepthFrameMetaData {
  uint32 frame_seq = 1;
  uint64 data_ts_ns = 2;
  uint64 right_data_ts_ns = 3;
  uint64 feed_ns = 4;
  uint64 dequeue_ns = 5;
  uint64 process_done_ns = 6;
  uint64 publish_done_ns = 7;
  uint32 stale_dropped = 8;
}
