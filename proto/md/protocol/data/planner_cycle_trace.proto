syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PlannerCycleTraceData {
  uint32 schema_version = 1;
  uint32 flags = 2;
  uint32 valid_inputs = 3;
  uint64 producer_instance_id = 4;
  uint64 engagement_id = 5;
  uint64 planner_epoch_id = 6;
  uint64 handover_id = 7;
  uint64 session_id = 8;
  uint64 cycle_sequence = 9;
  uint64 cycle_start_mono_ns = 10;
  uint64 robot_controller_instance_id = 11;
  uint64 robot_observation_sequence = 12;
  uint64 pico_device_instance_id = 13;
  uint64 pico_raw_first_sequence = 14;
  uint64 pico_raw_last_sequence = 15;
  uint32 pico_raw_sample_count = 16;
  uint64 intent_source_instance_id = 17;
  uint64 intent_sequence = 18;
  uint64 camera_instance_id = 19;
  uint64 image_frame_sequence = 20;
  uint64 perception_source_instance_id = 21;
  uint64 perception_sequence = 22;
  uint64 aux_feedback_controller_instance_id = 23;
  uint64 aux_feedback_sequence = 24;
  bytes context_selection_digest = 25;
  uint64 input_watermark_mono_ns = 26;
  uint64 primary_inference_request_id = 27;
  uint32 inference_request_count = 28;
  uint64 output_sequence = 29;
  sint64 output_first_frame_index = 30;
  uint32 output_representation = 31;
  uint32 execution_kind = 32;
  uint32 planner_state = 33;
  uint32 result_code = 34;
  bytes plugin_config_hash = 35;
  uint32 pico_raw_age_us = 36;
  uint32 robot_age_us = 37;
  uint32 image_age_us = 38;
  uint32 perception_age_us = 39;
  uint32 context_build_us = 40;
  uint32 inference_us = 41;
  uint32 postprocess_us = 42;
  uint32 publish_us = 43;
}
