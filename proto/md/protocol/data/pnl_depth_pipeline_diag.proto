syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PnlDepthPipelineDiagData {
  uint32 depth_frame_seq = 1;
  uint32 left_frame_seq = 2;
  uint32 right_frame_seq = 3;
  uint64 stage_flags = 4;
  sint32 result_code = 5;
  uint32 stale_dropped_total = 6;
  uint32 input_queue_dropped_total = 7;
  uint32 publisher_queue_dropped_total = 8;
  uint64 left_data_ts_ns = 9;
  uint64 right_data_ts_ns = 10;
  uint64 left_publish_ns = 11;
  uint64 right_publish_ns = 12;
  uint64 left_callback_enter_ns = 13;
  uint64 right_callback_enter_ns = 14;
  uint64 left_enqueue_ns = 15;
  uint64 right_enqueue_ns = 16;
  uint64 match_ns = 17;
  uint64 feed_ns = 18;
  uint64 dequeue_ns = 19;
  uint64 pre_check_start_ns = 20;
  uint64 pre_check_done_ns = 21;
  uint64 rectify_start_ns = 22;
  uint64 rectify_done_ns = 23;
  uint64 disparity_infer_start_ns = 24;
  uint64 dnn_input_prepare_done_ns = 25;
  uint64 dnn_cache_clean_done_ns = 26;
  uint64 dnn_submit_done_ns = 27;
  uint64 dnn_wait_done_ns = 28;
  uint64 dnn_release_done_ns = 29;
  uint64 dnn_output_invalidate_done_ns = 30;
  uint64 disparity_infer_done_ns = 31;
  uint64 depth_post_start_ns = 32;
  uint64 process_done_ns = 33;
  uint64 publish_submit_ns = 34;
  uint64 publish_worker_start_ns = 35;
  uint64 publish_wait_done_ns = 36;
  uint64 publish_copy_done_ns = 37;
  uint64 publish_done_ns = 38;
  uint64 pre_check_thread_cpu_ns = 39;
  uint64 pre_check_process_cpu_ns = 40;
  uint64 rectify_thread_cpu_ns = 41;
  uint64 rectify_process_cpu_ns = 42;
  uint64 infer_thread_cpu_ns = 43;
  uint64 infer_process_cpu_ns = 44;
  uint64 depth_post_thread_cpu_ns = 45;
  uint64 depth_post_process_cpu_ns = 46;
  uint64 publisher_thread_cpu_ns = 47;
  uint64 publisher_process_cpu_ns = 48;
}
