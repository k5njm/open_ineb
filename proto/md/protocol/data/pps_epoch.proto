syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PpsEpochData {
  uint64 source_session_id = 1;
  uint32 source_generation = 2;
  uint32 seq = 3;
  uint64 pulse_utc_ns = 4;
  uint64 epoch_sec = 5;
  uint32 flags = 6;
  uint32 source_uncertainty_ns = 7;
}
