syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message GameMarkerPoseData {
  uint64 timestamp_ns = 1;
  repeated float pos_body_xyz = 2;
  float distance_m = 3;
  float aim_yaw_deg = 4;
  float incidence_deg = 5;
  float reproj_error_px = 6;
  uint32 marker_id = 7;
  uint32 detection_valid = 8;
  float heading_deg = 9;
}
