syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message PicoRawSampleData {
  uint32 schema_version = 1;
  uint32 source_clock_domain = 2;
  uint32 timestamp_source = 3;
  uint32 valid_fields = 4;
  uint64 device_instance_id = 5;
  uint64 sequence = 6;
  uint64 source_timestamp_ns = 7;
  uint64 capture_mono_ns = 8;
  uint32 source_frame = 9;
  uint32 body_pose_count = 10;
  uint32 body_valid = 11;
  uint32 headset_valid = 12;
  uint32 controller_analog_valid_mask = 13;
  repeated float body_pose_xyz_xyzw = 14;
  repeated float headset_pose_xyz_xyzw = 15;
  repeated float controller_trigger = 16;
  repeated float controller_grip = 17;
  uint64 button_down_mask = 18;
  uint32 controller_axis_valid_mask = 19;
  repeated float controller_axis_xy = 20;
}
