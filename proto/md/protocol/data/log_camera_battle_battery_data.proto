syntax = "proto3";
package md.protocol.data;
import "md/protocol/common/wire_header.proto";

message LogCameraBattleBatteryDataData {
  uint64 timestamp_ns = 1;
  uint64 source_timestamp_ns = 2;
  uint64 frame_id = 3;
  float robot_confidence = 4;
  float battery_min_confidence = 5;
  float progress_s = 6;
  float progress_ratio = 7;
  uint32 source_age_ms = 8;
  uint32 link_age_ms = 9;
  uint32 dt_ms = 10;
  uint32 frames_received = 11;
  uint32 replaced_unprocessed = 12;
  uint32 reads_stale = 13;
  uint32 detection_valid = 14;
  uint32 reason = 15;
  uint32 hits = 16;
  uint32 sub_state = 17;
  uint32 lock_sounding = 18;
  uint32 geometry_valid = 19;
  uint32 geometry_reason = 20;
  float distance_m = 21;
  float aim_yaw_deg = 22;
  float heading_deg = 23;
  float heading_filtered_deg = 24;
  float incidence_deg = 25;
  float reprojection_error_px = 26;
  uint32 gate_bits = 27;
}
